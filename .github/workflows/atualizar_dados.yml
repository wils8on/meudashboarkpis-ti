name: Atualizar dados do TomTicket

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tomticket-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sanitização
        run: node --test tests/*.test.mjs

      - name: Coletar e sanitizar chamados
        env:
          TOMTICKET_TOKEN: ${{ secrets.TOMTICKET_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync-tomticket.mjs

      - name: Publicar somente a base sanitizada
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dados.json
          git diff-index --quiet HEAD || git commit -m "data: sincroniza indicadores sanitizados do TomTicket"
          git push
