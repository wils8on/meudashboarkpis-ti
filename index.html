<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KPI Analytics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            --accent-neon: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotate(15deg);
            z-index: 1;
            pointer-events: none;
        }

        .tech-scene {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .tech-orb {
            position: absolute;
            width: min(68vw, 820px);
            aspect-ratio: 1;
            top: 50%;
            left: 50%;
            border: 1px solid rgba(56, 189, 248, 0.08);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 0 90px rgba(139, 92, 246, 0.025), 0 0 120px rgba(56, 189, 248, 0.035);
        }

        .tech-orb::before,
        .tech-orb::after {
            content: '';
            position: absolute;
            inset: 11%;
            border: 1px dashed rgba(167, 139, 250, 0.09);
            border-radius: 50%;
            animation: orbit-spin 42s linear infinite;
        }

        .tech-orb::after {
            inset: 27%;
            border-style: solid;
            border-color: rgba(56, 189, 248, 0.08) transparent;
            animation-duration: 28s;
            animation-direction: reverse;
        }

        .circuit-map {
            position: absolute;
            inset: 7%;
            width: 86%;
            height: 86%;
            opacity: 0.52;
        }

        .circuit-line {
            fill: none;
            stroke: rgba(56, 189, 248, 0.22);
            stroke-width: 1;
            stroke-linecap: round;
            stroke-dasharray: 2 8;
            animation: data-flow 18s linear infinite;
        }

        .circuit-line.secondary {
            stroke: rgba(167, 139, 250, 0.18);
            animation-duration: 24s;
            animation-direction: reverse;
        }

        .circuit-node {
            fill: #38bdf8;
            filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.8));
            animation: node-pulse 3.4s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .circuit-node:nth-of-type(2n) { animation-delay: -1.1s; fill: #a78bfa; }
        .circuit-node:nth-of-type(3n) { animation-delay: -2.2s; }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 40px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
            z-index: 2;
            position: relative;
            overflow: hidden;
            animation: card-arrival 700ms cubic-bezier(.2,.8,.2,1) both;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -45%;
            width: 38%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-neon), transparent);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
            animation: scan-line 4.8s ease-in-out infinite 1s;
        }

        .brand-title {
            color: var(--text-main);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .brand-title i {
            color: var(--accent-neon);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .system-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 18px;
            padding: 5px 9px;
            color: #67e8f9;
            border: 1px solid rgba(34, 211, 238, 0.14);
            border-radius: 999px;
            background: rgba(34, 211, 238, 0.05);
            font: 600 9px ui-monospace, SFMono-Regular, Consolas, monospace;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .system-status::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2dd4bf;
            box-shadow: 0 0 8px rgba(45, 212, 191, .85);
            animation: status-pulse 2.2s ease-in-out infinite;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 13.5px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-google {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .btn-google img {
            width: 20px;
        }

        .btn-google:hover {
            background: rgba(56, 189, 248, 0.08);
            border-color: var(--accent-neon);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .error-message {
            color: #fda4af;
            margin-top: 25px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            background: rgba(244, 63, 94, 0.1);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(244, 63, 94, 0.2);
            line-height: 1.4;
        }

        @keyframes data-flow { to { stroke-dashoffset: -100; } }
        @keyframes orbit-spin { to { transform: rotate(360deg); } }
        @keyframes node-pulse { 0%, 100% { opacity: .28; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.35); } }
        @keyframes status-pulse { 50% { opacity: .45; box-shadow: 0 0 3px rgba(45, 212, 191, .35); } }
        @keyframes scan-line { 0%, 18% { transform: translateX(0); opacity: 0; } 35%, 65% { opacity: 1; } 82%, 100% { transform: translateX(485%); opacity: 0; } }
        @keyframes card-arrival { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }

        @media (max-width: 600px) {
            .login-card { width: calc(100% - 32px); padding: 42px 28px; }
            .tech-orb { width: 150vw; }
            .circuit-map { inset: 0; width: 100%; height: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .tech-orb::before, .tech-orb::after, .circuit-line, .circuit-node,
            .system-status::before, .login-card, .login-card::before { animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="tech-scene" aria-hidden="true">
        <div class="tech-orb"></div>
        <svg class="circuit-map" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
            <path class="circuit-line" d="M0 128H185l42 42h174l45-45h214l56 56h250l54-54h180"/>
            <path class="circuit-line secondary" d="M0 542h148l72-72h163l52 52h194l81-81h176l46 46h268"/>
            <path class="circuit-line" d="M92 0v96l66 66v146l-49 49v187l72 72v84"/>
            <path class="circuit-line secondary" d="M1090 0v122l-58 58v126l42 42v174l-65 65v113"/>
            <path class="circuit-line" d="M0 335h268l48-48h151m266 126h168l43-43h256"/>
            <circle class="circuit-node" cx="227" cy="170" r="3"/><circle class="circuit-node" cx="446" cy="125" r="3"/><circle class="circuit-node" cx="716" cy="181" r="3"/>
            <circle class="circuit-node" cx="220" cy="470" r="3"/><circle class="circuit-node" cx="435" cy="522" r="3"/><circle class="circuit-node" cx="710" cy="441" r="3"/>
            <circle class="circuit-node" cx="158" cy="308" r="3"/><circle class="circuit-node" cx="1032" cy="306" r="3"/><circle class="circuit-node" cx="944" cy="370" r="3"/>
        </svg>
    </div>

    <div class="login-card">
        <div class="system-status">Ambiente operacional</div>
        <div class="brand-title">
            <i class="fa-solid fa-chart-simple"></i> KPI ANALYTICS
        </div>
        <div class="brand-subtitle">
            SEJA BEM-VINDO!<br>
            Acesse com sua conta.
        </div>
        
        <button id="btnGoogleLogin" class="btn-google">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" style="width: 20px; height: 20px;">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24c0-1.61-.15-3.16-.42-4.69H24v8.87h12.62c-.54 2.87-2.16 5.31-4.59 6.94l7.15 5.54C43.34 36.56 46.5 30.93 46.5 24z"/>
                <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.15-5.54c-1.99 1.33-4.52 2.1-8.74 2.1-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Conectar com Google
        </button>
        
        <div id="msgErroLogin" class="error-message"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { firebaseConfig } from "./js/firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('btnGoogleLogin').addEventListener('click', () => {
            const errorDiv = document.getElementById('msgErroLogin');
            errorDiv.style.display = 'none';

            // Usamos Janela Pop-up para evitar bloqueios de cookies do GitHub Pages
            signInWithPopup(auth, provider)
                .then(async (result) => {
                    const user = result.user;
                    
                    // Consulta no banco Firestore se este e-mail está autorizado
                    const userDoc = await getDoc(doc(db, "usuarios_autorizados", user.email.toLowerCase()));
                    
                    if (userDoc.exists() && userDoc.data().status === "permitido") {
                        localStorage.setItem('user_email', user.email);
                        localStorage.setItem('user_nome', user.displayName);
                        
                        window.location.href = 'dashboard.html';
                    } else {
                        errorDiv.textContent = "Acesso negado. ID operacional não catalogado no Firestore.";
                        errorDiv.style.display = 'block';
                        signOut(auth);
                    }
                })
                .catch((error) => {
                    errorDiv.style.display = 'block';
                    console.error(error);
                    
                    // Autodiagnóstico inteligente de erros
                    if (error.code === 'auth/unauthorized-domain') {
                        errorDiv.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <strong>Configuração pendente:</strong> Adicione o domínio <u>wils8on.github.io</u> na aba 'Authentication > Configurações > Domínios Autorizados' dentro do console do seu Firebase.`;
                    } else if (error.code === 'auth/popup-blocked') {
                        errorDiv.textContent = "O pop-up de login foi bloqueado pelo seu navegador. Por favor, permita pop-ups para este site.";
                    } else {
                        errorDiv.textContent = "Falha no link de dados: " + error.message;
                    }
                });
        });
    </script>
</body>
</html>
